          grep -Fq 'key[KeyType::FREEMOVE] = KeyPress("KEY_KEY_X")' multicraft/src/client/inputhandler.cpp

      - name: Install build dependencies on remote Mac
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake wget gettext glslang spirv-cross pkg-config
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          df -h .

      - name: Build only Intel (x86_64) dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          sdk = Path('multicraft/Apple/scripts/sdk.sh')
          text = sdk.read_text()
          substitutions = {
            'export OSX_OSVER=10.15': 'export OSX_OSVER=12.0',
            'export OSX_ARCHES="x86_64 arm64"': 'export OSX_ARCHES="x86_64"',
            'export OSX_ARCHITECTURES="x86_64;arm64"': 'export OSX_ARCHITECTURES="x86_64"',
            'export OSX_ARCH="-arch x86_64 -arch arm64"': 'export OSX_ARCH="-arch x86_64"',
          }
          for before, after in substitutions.items():
              assert text.count(before) == 1, f'Unexpected sdk.sh: {before}'
              text = text.replace(before, after)
          sdk.write_text(text)
          for name in ('libSDL.sh', 'libpng.sh', 'luajit.sh', 'openal.sh', 'nghttp2.sh'):
              f = Path('multicraft/Apple/scripts') / name
              text = f.read_text()
              assert 'for ARCH in x86_64 arm64' in text, f'Unexpected {name}'
              f.write_text(text.replace('for ARCH in x86_64 arm64', 'for ARCH in x86_64'))
          PY
          cd multicraft/Apple
          bash ./Start.sh 2>&1 | tee "$GITHUB_WORKSPACE/multicraft-build.log"

      - name: Compile MultiCraft.app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project multicraft/Apple/MultiCraft/MultiCraft.xcodeproj \
            -target MultiCraft \
            -configuration Release \
            -sdk macosx \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$GITHUB_WORKSPACE/products" \
            build 2>&1 | tee -a "$GITHUB_WORKSPACE/multicraft-build.log"

      - name: Pack app for transfer to iPad
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$GITHUB_WORKSPACE/products" -type d -name 'MultiCraft.app' -print -quit)"
          test -n "$APP"
          test -d "$APP/Contents/MacOS"
          mkdir -p "$GITHUB_WORKSPACE/result"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "$GITHUB_WORKSPACE/result/MultiCraft-GX-Monterey-Intel-UNVERIFIED.zip"
          ls -lh "$GITHUB_WORKSPACE/result/"

      - name: Upload ready Mac application
        uses: actions/upload-artifact@v4
        with:
          name: MultiCraft-GX-Monterey-Intel-UNVERIFIED
          path: result/MultiCraft-GX-Monterey-Intel-UNVERIFIED.zip
          if-no-files-found: error
          retention-days: 14

      - name: Save error log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MultiCraft-error-log
          path: multicraft-build.log
          if-no-files-found: warn
          retention-days: 14


name: "MultiCraft GX - G Freecam and X Fly"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-intel:
    name: Build for MacBook Air 2015 / Monterey
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Choose compatible Xcode and check input
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          echo "Single-file patch is bundled in this workflow"
          python3 --version
          df -h .

      - name: Get pinned public MultiCraft source code
        shell: bash
        run: |
          set -euo pipefail
          mkdir multicraft
          cd multicraft
          git init -q
          git remote add origin https://github.com/MultiCraft/MultiCraft.git
          git fetch --depth=1 origin 1e0acbb3353bc0f13909d1112d47a49bb3d6763d
          git -c advice.detachedHead=false checkout -q FETCH_HEAD


name: MultiCraft GX v3 - Intel macOS experimental

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MultiCraft GX v3 for Intel Mac (unverified)
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Verify Intel macOS and Xcode
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = x86_64
          xcodebuild -version
          python3 --version
          df -h .

      - name: Download pinned MultiCraft 2.1.0 engine
        shell: bash
        run: |
          set -euo pipefail
          git init -q multicraft
          git -C multicraft remote add origin https://github.com/MultiCraft/MultiCraft.git
          git -C multicraft fetch --depth 1 origin 1e0acbb3353bc0f13909d1112d47a49bb3d6763d
          git -C multicraft checkout -q FETCH_HEAD
          test "$(git -C multicraft rev-parse HEAD)" = 1e0acbb3353bc0f13909d1112d47a49bb3d6763d


      - name: Install macOS build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake wget gettext glslang spirv-cross pkg-config
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Set Intel-only build and Monterey deployment target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          sdk = Path('multicraft/Apple/scripts/sdk.sh')
          s = sdk.read_text()
          swaps = {
            'export OSX_OSVER=10.15': 'export OSX_OSVER=12.0',
            'export OSX_ARCHES="x86_64 arm64"': 'export OSX_ARCHES="x86_64"',
            'export OSX_ARCHITECTURES="x86_64;arm64"': 'export OSX_ARCHITECTURES="x86_64"',
            'export OSX_ARCH="-arch x86_64 -arch arm64"': 'export OSX_ARCH="-arch x86_64"',
          }
          for old, new in swaps.items():
              assert s.count(old) == 1, 'sdk.sh changed: ' + old
              s = s.replace(old, new)
          sdk.write_text(s)
          for name in ('libSDL.sh', 'libpng.sh', 'luajit.sh', 'openal.sh', 'nghttp2.sh'):
              path = Path('multicraft/Apple/scripts') / name
              s = path.read_text()
              old = 'for ARCH in x86_64 arm64'
              assert s.count(old) == 1, name + ' has changed'
              path.write_text(s.replace(old, 'for ARCH in x86_64'))
          PY

      - name: Build MultiCraft macOS dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd multicraft/Apple
          bash ./Start.sh 2>&1 | tee "$GITHUB_WORKSPACE/multicraft-build.log"

      - name: Compile patched MultiCraft.app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project multicraft/Apple/MultiCraft/MultiCraft.xcodeproj \
            -target MultiCraft \
            -configuration Release \
            -sdk macosx \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$GITHUB_WORKSPACE/products" \
            build 2>&1 | tee -a "$GITHUB_WORKSPACE/multicraft-build.log"

      - name: Package game app
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$GITHUB_WORKSPACE/products" -type d -name MultiCraft.app -print -quit)"
          test -n "$APP"
          test -d "$APP/Contents/MacOS"
          mkdir -p result
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            result/MultiCraft-GX-v3-Intel-UNVERIFIED.zip
          ls -lh result/

      - name: Upload Intel Mac game
        uses: actions/upload-artifact@v4
        with:
          name: MultiCraft-GX-v3-Intel-UNVERIFIED
          path: result/MultiCraft-GX-v3-Intel-UNVERIFIED.zip
          if-no-files-found: error
          retention-days: 14

      - name: Save build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MultiCraft-GX-v3-error-log
          path: multicraft-build.log
          if-no-files-found: warn
          retention-days: 14


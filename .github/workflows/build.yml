
name: MultiCraft GX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - name: Download MultiCraft
        run: |
          git clone https://github.com/MultiCraft/MultiCraft.git multicraft

      - name: Check original source
        run: |
          grep -q "VERSION_MAJOR 2" multicraft/CMakeLists.txt
          echo "MultiCraft source downloaded successfully"
